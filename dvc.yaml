# Pipeline DAG. Stages are added one by one as they are built.
stages:
  ingest:
    cmd: python -m src.pipeline.ingest
    deps:
      - data/raw
      - src/pipeline/ingest.py
      - src/common
    params:
      - paths
      - spark
      - ingest
    outs:
      - data/interim

  validate:
    cmd: python -m src.pipeline.validate
    deps:
      - data/interim
      - src/pipeline/validate.py
      - src/pipeline/ingest.py
      - src/common
    params:
      - paths
      - spark
      - cities
      - replay
      - validate
    metrics:
      - reports/validation.json:
          cache: false
