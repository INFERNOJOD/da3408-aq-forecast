# Pipeline DAG. Stages are added one by one as they are built.
stages:
  ingest:
    cmd: python -m src.pipeline.ingest
    deps:
      - data/raw
      - src/pipeline/ingest.py
      - src/common
    params:
      - paths
      - spark
      - ingest
    outs:
      - data/interim

  validate:
    cmd: python -m src.pipeline.validate
    deps:
      - data/interim
      - src/pipeline/validate.py
      - src/pipeline/ingest.py
      - src/common
    params:
      - paths
      - spark
      - cities
      - replay
      - validate
    metrics:
      - reports/validation.json:
          cache: false

  features:
    cmd: python -m src.pipeline.features
    deps:
      - data/interim
      - reports/validation.json
      - src/pipeline/features.py
      - src/common
    params:
      - paths
      - spark
      - cities
      - cutoff
      - replay
      - features
    outs:
      - data/features
      - reports/baseline_stats.json:
          cache: false

  train:
    cmd: python -m src.pipeline.train
    deps:
      - data/features/train.parquet
      - reports/baseline_stats.json
      - src/pipeline/train.py
      - src/pipeline/modeling.py
      - src/pipeline/aq_model.py
      - src/pipeline/train_plots.py
      - src/common
    params:
      - paths
      - cities
      - cutoff
      - eval_window_days
      - train
    outs:
      - models/candidate
      - reports/train_metrics.json:
          cache: false

  evaluate:
    cmd: python -m src.pipeline.evaluate
    deps:
      - models/candidate
      - data/features/train.parquet
      - reports/train_metrics.json
      - src/pipeline/evaluate.py
      - src/pipeline/registry.py
      - src/pipeline/modeling.py
      - src/common
    params:
      - paths
      - cutoff
      - eval_window_days
      - promotion.model_name
    metrics:
      - reports/eval.json:
          cache: false

  test:
    cmd: python -m src.pipeline.test_gate
    deps:
      - reports/eval.json
      - src/pipeline/test_gate.py
      - src/common
    params:
      - paths
      - promotion.max_ratio_to_baseline
    metrics:
      - reports/gate.json:
          cache: false

  register:
    cmd: python -m src.pipeline.register
    deps:
      - reports/gate.json
      - reports/eval.json
      - reports/train_metrics.json
      - models/candidate
      - src/pipeline/register.py
      - src/pipeline/registry.py
      - src/common
    params:
      - paths
      - cutoff
      - promotion.model_name
    metrics:
      - reports/register.json:
          cache: false
