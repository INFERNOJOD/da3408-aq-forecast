# Alertmanager sends every alert to the backend webhook (POST /ops/alerts).
# The backend creates a retrain request only for firing alerts with
# action=retrain and applies its own 30-minute cooldown.
route:
  receiver: backend
  group_by: [alertname]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 30m

receivers:
  - name: backend
    webhook_configs:
      - url: https://backend:8000/ops/alerts
        send_resolved: true
        http_config:
          tls_config:
            ca_file: /etc/alertmanager/ca.crt
          authorization:
            type: Bearer
            # Written from OPS_API_KEY in .env at start (see docker-compose.yml).
            credentials_file: /tmp/ops_api_key
