# Prometheus configuration (docs/LLD.md section 5).
# Scrape interval 15 s, the lowest the machine limits allow. Retention is 2 days
# (set on the command line in docker-compose.yml).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # My own services.
  - job_name: backend
    static_configs:
      - targets: ["backend:8000"]
  - job_name: model-server              # the metrics proxy in front of mlflow models serve
    static_configs:
      - targets: ["model-server:8001"]
  - job_name: frontend                  # Streamlit's exporter thread
    static_configs:
      - targets: ["frontend:8502"]
  # The pipeline runs in batches, so it pushes to the Pushgateway and
  # Prometheus scrapes that. honor_labels keeps the pushed job and stage labels.
  - job_name: pushgateway
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]
  # Third-party parts of the stack.
  - job_name: mlflow
    static_configs:
      - targets: ["mlflow:5000"]
  - job_name: node                      # host CPU, memory, disk
    static_configs:
      - targets: ["node-exporter:9100"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]
