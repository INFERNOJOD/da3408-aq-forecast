# Prometheus configuration. Scrape interval 15 s (machine limit: >= 15 s).
# Stage 11 scrapes the backend only; Stage 14 adds the other components.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: backend
    static_configs:
      - targets: ["backend:8000"]
