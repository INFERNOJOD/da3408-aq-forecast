# Project settings read by the pipeline (tracked by DVC as pipeline params).

paths:
  raw_dir: data/raw
  interim_dir: data/interim
  features_dir: data/features
  reports_dir: reports
  models_dir: models
  raw_dvc: data/raw.dvc       # DVC file that holds the raw data version

spark:
  driver_memory: 2g          # machine limit: 8 GB RAM total (about 3.9 GB free)
  shuffle_partitions: 8
  cores: 4

ingest:
  # Files read from raw_dir. Each becomes a Parquet dataset in interim_dir.
  tables: [city_day, city_hour, station_day, station_hour, stations]

cities: [Delhi, Chennai, Lucknow, Hyderabad, Bengaluru, Jaipur, Kolkata]

cutoff: "2020-03-24 23:00:00"   # last hour used for training
eval_window_days: 3

# Replay of the 2020 lockdown as simulated live traffic (inclusive hours).
replay:
  start: "2020-03-25 00:00:00"
  end: "2020-06-30 23:00:00"

# Limits used by the validate stage. "Hard" failures stop the pipeline.
validate:
  time_range:                       # any timestamp outside this is a hard failure
    min: "2015-01-01 00:00:00"
    max: "2020-12-31 23:59:59"
  # Keys are quoted on purpose: an unquoted NO is read by YAML as boolean false.
  max_values:                       # sensor ceilings; above this is a hard failure
    "PM2.5": 1000
    "PM10": 1000
    "NO": 500
    "NO2": 500
    "NOx": 500
    "NH3": 500
    "CO": 500
    "SO2": 500
    "O3": 1000
    "Benzene": 500
    "Toluene": 500
    "Xylene": 500
    "AQI": 5000
  warn_missing_share: 0.5           # warning if a table misses more PM2.5 than this
  min_city_hours: 15000             # selected cities need at least this many hourly rows
  min_city_pm25_share: 0.7          # ... and this share of non-missing PM2.5 values
  min_replay_coverage: 0.5          # ... and this share of PM2.5 hours inside the replay window

# Settings for the features stage.
features:
  max_ffill_hours: 3                       # fill gaps of up to this many hours (lag inputs only)
  serving_start: "2020-01-01 00:00:00"     # first hour stored for the live replay
  psi_bins: 10                             # bins for the drift baseline of pm25_lag_1
  baseline_years: [2016, 2019]             # drift baseline = same calendar hours of these years
  drift_window_hours: 168                  # length of a live drift window and of a baseline block
  baseline_min_n: 100                      # each city and block needs at least this many reference values

# Settings for the train stage.
train:
  experiment: aq-pm25
  half_life_days: 30           # recency weight: a row this much older counts half as much
  seed: 42
  high_pm25_threshold: 121     # "Very Poor" and above: error on these hours is reported separately
  ridge:
    alpha: 1.0
  lightgbm:
    objective: regression_l1   # median loss: matches the MAE used to compare models
    n_estimators: 400
    learning_rate: 0.05
    num_leaves: 31
    min_child_samples: 20
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.8
    n_jobs: 4
