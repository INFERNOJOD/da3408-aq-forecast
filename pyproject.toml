[project]
name = "aq-forecast"
version = "0.1.0"
description = "Air quality (PM2.5) forecasting with AIOps - DA3408 course project"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyspark>=3.5,<4",
    "pyyaml>=6",
    "prometheus-client>=0.20",
    "python-dotenv>=1.0",
    "dvc>=3.67.1",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "matplotlib>=3.11.2",
    "scikit-learn>=1.9.1",
    "lightgbm>=4.7.0",
    "mlflow>=3.17.1",
    "fastapi>=0.151.0",
    "uvicorn>=0.54.0",
    "streamlit>=1.66.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# E/W = pycodestyle (PEP 8), F = pyflakes, I = import order, N = naming, D = docstrings
select = ["E", "W", "F", "I", "N", "D", "B"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
